schema: spec-driven

context: |
  This store holds the specs for our agent platform: how we run autonomous
  coding agents against tracker tickets, watch them, steer them, and measure
  them. It is our own design. We reuse open source to keep friction low and
  keep each fork close enough to its upstream to take fixes. Upstream design
  decisions are inputs and merge costs, not constraints.

  This store is specs/ in the agentic-orchestration repository
  (~/dev/agentic-orchestration, AGPL-3.0-or-later). Components and where
  their code lives:
    - sortie (the sortie/ submodule, our fork of sortie-ai/sortie, Go,
      Apache-2.0): the orchestrator. Polls the tracker, runs agent sessions
      per ticket, stage chains, reactions, handoff. Our default branch is
      plan-bench; feature branches start from it and merge back into it.
      Our changes stay small and isolated, so upstream merges stay cheap.
    - acp-broker (acp-broker/, Go): sits between sortie and an ACP agent.
      One session, two input vectors: the autonomous driver and humans
      (watch, steer, take over, hand back, answer permissions). A separate
      program: it talks to Sortie over its HTTP API and session
      environment, and imports nothing from it.
    - plan workbench and planlib (workbench/, Python and Svelte): plan a
      project as epics and stories, approve them, sync them to the tracker,
      and watch and steer the agents that work on them.
    - smol-builder (smol-builder/, Go): builds the smolvm packs agents run in.
    - Agents over ACP: opencode (primary), pi via pi-acp, claude-agent-acp
      (used to validate designs against a second agent).
    - Sandboxes: VMs where agents run tools freely. Free tool use is a goal;
      the sandbox is what makes it safe. Chosen: smolvm (smol-machines,
      libkrun microVMs), driven over its HTTP API on a unix socket. wtvm
      (~/dev/wtvm) is prior art only.
    - Human surfaces: acp-broker attach (TUI), herdr (~/dev/herdr) panes and
      the herdr-web-ui plugin for web and phone.
    - Tracker: Huly (adapter with plan writes on sortie branch plan-bench).
    - Telemetry: OpenTelemetry Collector; Langfuse (self-hosted, MIT core) for
      LLM traces and cost per stage; sortie's Prometheus metrics.

  Conventions:
    - Code in sortie/ follows sortie's AGENTS.md (no CGo, generic names in
      core, adapters behind registries). Go code in this repository uses no
      CGo, and acp-broker uses the standard library only.
    - Record upstream work we track (for example ACP PRs) in
      acp-broker/docs/notes.md.

