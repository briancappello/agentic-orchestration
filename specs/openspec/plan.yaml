# The order between this store's changes: the epic-level plan graph.
# Format: openspec/schemas/planning/plan.schema.json
# Validate after every edit: planlib validate --store .
schema_version: 1
changes:
  - name: sortie-session-control
    depends_on: []
  - name: acp-broker
    depends_on: [sortie-session-control]
  - name: agent-telemetry
    depends_on: [acp-broker]
  - name: plan-to-tracker-dag
    depends_on: [sortie-session-control, acp-broker]
