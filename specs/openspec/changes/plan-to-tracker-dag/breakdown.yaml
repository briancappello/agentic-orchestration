# Format: openspec/schemas/planning/breakdown.schema.json
# Validate after every edit: planlib validate --store <store-root>
schema_version: 1
status: draft
deliverables:
  - id: planning-formats
    title: Publish the planning schemas and the planned OpenSpec schema
    kind: enabler
    depends_on: []
    covers:
      - planning/breakdown-artifact#Breakdown file in every planned change
      - planning/breakdown-artifact#Published schema
      - planning/plan-of-plans#Plan file in the store
    acceptance_criteria:
      - breakdown, plan, and plan-graph JSON Schemas at schema_version 1 accept valid samples and reject unknown fields, a bad kind, and missing acceptance criteria.
      - openspec status for a spec-driven-planned change lists breakdown, blocked until specs and design are done.

  - id: plan-validator
    title: Validate the plan with planlib and output the plan graph
    kind: story
    depends_on: [planning-formats]
    covers:
      - planning/plan-validator#One validator, run by the agent and the workbench
      - planning/plan-validator#Checks beyond the schema
      - planning/plan-validator#The validated graph is the exchange format
      - planning/plan-of-plans#One combined graph
      - planning/breakdown-artifact#Approval before sync
    acceptance_criteria:
      - planlib validate reports every schema and graph problem with its file, change, and deliverable, and exits non-zero.
      - planlib graph outputs a document that matches plan-graph.schema.json only when validation passes.
      - Editing an approved breakdown's deliverables makes it read as draft.

  - id: first-plan
    title: Write the store's first plan and this change's breakdown
    kind: enabler
    depends_on: [plan-validator]
    covers:
      - planning/plan-of-plans#Plan file in the store
    acceptance_criteria:
      - planlib validate passes on the spec store.

  - id: write-capabilities
    title: Add optional tracker write capabilities to Sortie's contract
    kind: enabler
    depends_on: []
    covers:
      - sortie/tracker-write-capabilities#Optional write capabilities
      - sortie/tracker-write-capabilities#Declared at registration
      - sortie/tracker-write-capabilities#Write errors
    acceptance_criteria:
      - The registry rejects an adapter that declares a capability it does not implement.
      - Every existing adapter registers with no write capabilities and keeps working.

  - id: huly-write-path
    title: Create, update, parent, and link issues in Huly
    kind: story
    depends_on: [write-capabilities]
    covers:
      - sortie/tracker-write-capabilities#Plan keys are readable
      - sortie/tracker-write-capabilities#Kinds map to the tracker's own model
      - sortie/tracker-write-capabilities#Write errors
    acceptance_criteria:
      - Against the local Huly, an epic and a story are created nested, with the right task types and description.
      - A blocker added through the adapter is reported by FetchCandidateIssues.
      - An issue is found by its plan key after a rename in the UI.

  - id: plan-sync
    title: Preview and apply a plan graph against the tracker
    kind: story
    depends_on: [write-capabilities]
    covers:
      - sortie/plan-sync#Sync from a validated plan graph
      - sortie/plan-sync#Reject a malformed graph
      - sortie/plan-sync#Preview before apply
      - sortie/plan-sync#Idempotent by plan key
      - sortie/plan-sync#What a sync never does
      - sortie/plan-sync#Refuse what the tracker cannot hold
      - sortie/plan-sync#Partial failure is reported and resumable
    acceptance_criteria:
      - A second sync with an unchanged graph previews no writes.
      - A stale preview or a missing capability is refused before the first write.
      - sortie plan sync --graph <file> --dry-run prints the preview.

  - id: plan-api
    title: Serve plan sync, the plan graph, and capabilities over HTTP
    kind: story
    depends_on: [plan-sync]
    covers:
      - sortie/plan-graph-api#Read the synced plan graph
      - sortie/plan-graph-api#Live state joined in
      - sortie/plan-graph-api#Tracker-independent shape
      - sortie/plan-graph-api#Authentication and errors
      - sortie/plan-sync#Sync runs outside the orchestrator
    acceptance_criteria:
      - GET /api/v1/plan/graph returns plan-keyed nodes, parents, edges, and runtime state, and an error with no nodes when the tracker is down.
      - POST /api/v1/plan/sync previews and applies behind control-API authentication.

  - id: tracker-api-operations
    title: Add planning operations to the tracker_api tool
    kind: story
    depends_on: [write-capabilities]
    covers:
      - sortie/tracker-api-planning-operations#Planning operations in tracker_api
      - sortie/tracker-api-planning-operations#Advertised only when supported
      - sortie/tracker-api-planning-operations#Project scope
    acceptance_criteria:
      - Planning operations are advertised and accepted only when the adapter declares them.
      - An operation naming an issue outside the project returns project_scope_violation and writes nothing.

  - id: workbench-backend
    title: Serve the merged plan graph, sync, and approval from the workbench backend
    kind: story
    depends_on: [plan-validator, plan-api]
    covers:
      - planning/plan-workbench#One graph from three sources
      - planning/plan-workbench#Invalid plans are shown, not hidden
      - planning/plan-workbench#Sync with preview
      - planning/plan-workbench#Access
    acceptance_criteria:
      - A store edit reaches the merged graph within two seconds; an invalid edit keeps the last graph and reports the errors.
      - No response to the browser carries the Sortie or broker token.

  - id: planning-session
    title: Run planning sessions through acp-broker from the workbench
    kind: story
    depends_on: [workbench-backend]
    covers:
      - planning/planning-session#Session over acp-broker
      - planning/planning-session#The spec store is the workspace
      - planning/planning-session#Sessions survive a reload
    acceptance_criteria:
      - A message, a permission request, and its answer round-trip through the relay.
      - A reload reattaches to the running session with its history.

  - id: workbench-ui
    title: Build the graph pane, chat pane, and sync dialog
    kind: story
    depends_on: [workbench-backend]
    covers:
      - planning/plan-workbench#Two-pane layout
      - planning/plan-workbench#Graph flows from ready to done
      - planning/plan-workbench#Two levels of detail
      - planning/plan-workbench#Node encoding
      - planning/plan-workbench#Live redraw
      - planning/plan-workbench#Selection details
      - planning/planning-session#The agent can read the selection
    acceptance_criteria:
      - At 1440px the graph pane is 864px and the chat pane 576px; below 1200px they stack.
      - A live update keeps the level, the selection, and the scroll position.

  - id: end-to-end
    title: Plan, sync, and dispatch one change end to end on Huly
    kind: story
    depends_on: [huly-write-path, planning-session, workbench-ui, first-plan, tracker-api-operations]
    covers: []
    acceptance_criteria:
      - A breakdown drafted in the chat is approved, synced, and shows in Huly with its dependencies.
      - Sortie dispatches only the unblocked story, and its running badge appears on the graph.
