# Publish a Go module's release archives when its tag is pushed:
# acp-broker/v0.1.0 releases acp-broker, smol-builder/v0.1.0 smol-builder.

name: Release

on:
  push:
    tags:
      - "acp-broker/v*"
      - "smol-builder/v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          # Release builds start clean, so a poisoned cache cannot reach them.
          cache: false
      - name: Split the tag into module and version
        run: |
          echo "MODULE=${TAG%%/*}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#*/}" >> "$GITHUB_ENV"
      - run: make -C "$MODULE" test
      - run: make -C "$MODULE" dist VERSION="$VERSION"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$MODULE"/dist/* --title "$MODULE $VERSION" --generate-notes --verify-tag
