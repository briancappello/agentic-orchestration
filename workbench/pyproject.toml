[project]
name = "plan-workbench"
version = "0.1.0"
description = "Plan validator (planlib) and the plan workbench backend"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.22",
    "networkx>=3.3",
]

[project.scripts]
planlib = "planlib.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
