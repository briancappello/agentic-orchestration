[project]
name = "plan-workbench"
version = "0.1.0"
description = "Plan validator (planlib) and the plan workbench"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.22",
    "networkx>=3.3",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "watchfiles>=1.3.0",
    "itsdangerous>=2.2.0",
    "joserfc>=1.0",
]

[project.urls]
Source = "https://github.com/briancappello/agentic-orchestration"

[project.scripts]
planlib = "planlib.cli:main"
workbench = "workbench.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planlib", "src/workbench"]

# hatch_build.py puts the built frontend and the planning prompt inside the
# package of a wheel, but not of an editable install.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning fails the suite, so green means no warnings.
filterwarnings = ["error"]
