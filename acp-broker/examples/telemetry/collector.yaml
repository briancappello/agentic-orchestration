# OpenTelemetry Collector configuration for acp-broker telemetry.
#
# The broker exports each turn of its session over OTLP/HTTP to this
# Collector on loopback (acp-broker -otlp-endpoint http://127.0.0.1:4318),
# and the Collector forwards the traces to Langfuse. The broker never
# holds Langfuse's keys.
#
# Environment:
#   LANGFUSE_OTLP_ENDPOINT  Langfuse's OTLP endpoint, for example
#                           http://127.0.0.1:3000/api/public/otel
#   LANGFUSE_AUTH           base64 of "<public key>:<secret key>":
#                           printf '%s' "pk-lf-...:sk-lf-..." | base64 -w0
#
# Check it with: otelcol-contrib validate --config collector.yaml

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  batch: {}

exporters:
  otlp_http/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH}"
      # Without it, Langfuse may show directly ingested spans only after
      # up to ten minutes.
      x-langfuse-ingestion-version: "4"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/langfuse]
