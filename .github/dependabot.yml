# Weekly update pull requests for every dependency manifest, with minor and
# patch updates grouped per ecosystem so they arrive as one pull request.
# Third-party releases wait 7 days, so a compromised release is usually
# pulled before Dependabot proposes it.

version: 2

updates:
  - package-ecosystem: gomod
    directories: [/acp-broker, /smol-builder]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /workbench
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /workbench/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Moves sortie/ to the newest commit on its tracked branch, plan-bench.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
